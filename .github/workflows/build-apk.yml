name: Build Android APK

# The app is a thin Capacitor shell that just loads the live site (see client/capacitor.config.json),
# so this only needs to run when something about the native shell itself changes — icon, splash,
# Android project config — not on every ordinary website change. Manual trigger is always available.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'client/android/**'
      - 'client/capacitor.config.json'
      - 'client/scripts/generate-icon-sources.mjs'
      - 'client/package.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build web assets
        working-directory: client
        run: npx vite build

      - name: Sync Capacitor Android project
        working-directory: client
        run: npx cap sync android

      - name: Build debug APK
        working-directory: client/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp client/android/app/build/outputs/apk/debug/app-debug.apk sabishub.apk

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk
          name: SabisHub Android App
          body: Automatically built from the latest native shell config. This wraps the live website — no need to rebuild for ordinary site updates, only for icon/permission/native changes.
          files: sabishub.apk
