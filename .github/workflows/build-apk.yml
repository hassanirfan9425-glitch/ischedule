name: Build Android APK

# The app is a thin Capacitor shell that just loads the live site (see client/capacitor.config.json),
# so this only needs to run when something about the native shell itself changes — icon, splash,
# Android project config — not on every ordinary website change. Manual trigger is always available.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'client/android/**'
      - 'client/capacitor.config.json'
      - 'client/scripts/generate-icon-sources.mjs'
      - 'client/package.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

env:
  # Not a secret in the security sense — this key only exists to keep every build's signature
  # consistent so Android accepts each new APK as an update to the last one, not a different app.
  RELEASE_KEYSTORE_PASSWORD: sabishub-android-release
  RELEASE_KEY_ALIAS: sabishub
  RELEASE_KEY_PASSWORD: sabishub-android-release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build web assets
        working-directory: client
        run: npx vite build

      - name: Sync Capacitor Android project
        working-directory: client
        run: npx cap sync android

      - name: Restore or create persistent release keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: client/android/app/release.keystore
          key: release-keystore-v1

      - name: Generate release keystore (first run only)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore client/android/app/release.keystore \
            -alias "$RELEASE_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" -keypass "$RELEASE_KEY_PASSWORD" \
            -dname "CN=SabisHub, OU=SabisHub, O=SabisHub, L=Dubai, S=Dubai, C=AE"

      - name: Build release APK
        working-directory: client/android
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp client/android/app/build/outputs/apk/release/app-release.apk sabishub.apk

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk
          name: SabisHub Android App
          body: Automatically built from the latest native shell config. This wraps the live website — no need to rebuild for ordinary site updates, only for icon/permission/native changes.
          files: sabishub.apk
